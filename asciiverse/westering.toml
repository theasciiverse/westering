schema_version = 1
id = "westering"
kind = "game"
title = "Westering"
description = "Take a wagon party two thousand miles from Independence to the Willamette Valley in 1848: outfit, pace and rations, hunting, seven rivers and the forts between."
year = 2026
license = "MIT"
repo = "theasciiverse/westering"
provenance = "A journey game in the line of The Oregon Trail (Don Rawitsch, Bill Heinemann and Paul Dillenberger, 1971), on the real road of 1848, written for Asciiverse in 2026."
topics = ["oregon trail", "journey", "history", "survival", "wagon", "1848", "rust"]
genre = "strategy"

[developer]
name = "Asciiverse"
url = "https://asciiverse.sh"

# the archive holds westering, README.md and LICENSE; nothing is saved
[exec]
game = "westering"
args = []

# the text is set in a 72-column page; 24 rows fit every screen
[min_terminal]
cols = 72
rows = 24

[requires]
utf8 = false
color = "truecolor"
mouse = false
gamepad = false

# 100x30, recorded with hub/tools/castrec.py and --seed 7: outfitting in
# Independence, the first week, the Kansas River by ferry; the still is the
# river scene
[media]
cast = "asciiverse/westering.cast"
thumbnail_at = 29.5

[release]
source = "github"
